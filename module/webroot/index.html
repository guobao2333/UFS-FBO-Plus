<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FBO+</title>
    <link rel="stylesheet" href="assets/theme.css">
    <link rel="stylesheet" href="assets/app.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-title">FBO+</div>
        <span class="chip" id="chip">检测中…</span>
    </header>

    <main>
        <section class="card">
            <div class="big"><span id="total">0</span><em>个</em></div>
            <p class="biglabel" id="bigLabel">还没有记录</p>
            <div class="plot">
                <div class="grid" id="grid"></div>
                <div class="bars" id="bars"></div>
                <div class="yticks" id="yticks"></div>
            </div>
            <div class="xaxis" id="xaxis"></div>
        </section>

        <button class="btn secondary" id="toggleList">选择应用 · 已选 0 个</button>
        <div class="applist" id="applist" hidden></div>

        <details class="card diag">
            <summary>运行日志</summary>
            <pre id="diag">—</pre>
        </details>
    </main>

    <div class="bottombar">
        <button class="btn primary" id="runBtn" disabled>立即焕新</button>
    </div>

    <!-- 经典外部脚本：su:// 下可正常加载，WebView 不缓存它（只有 type="module" 会被 CORS 拦） -->
    <script src="assets/app.js"></script>
</body>

</html>
